# Alembic configuration.
# The database URL is taken from POSTGRES_DSN (env / .env) in migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = . src
# Fallback only; env.py overrides it from POSTGRES_DSN.
sqlalchemy.url = postgresql+asyncpg://rag:rag@localhost:5432/rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
