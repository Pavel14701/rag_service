[project]
name = "rag"
version = "0.1.0"
license = { text = "MIT" }
description = "Async RAG service: document indexing and retrieval-augmented QA over RabbitMQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.3.1",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.7.0",
    "dishka>=1.2.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=2.7.0",
    "unstructured[pdf,docx,md]>=0.15.0",
    "markdown>=3.5.2",
    "python-magic>=0.4.27",
    "minio>=7.2.7",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "langfuse>=2.44.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.1",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "redis>=8.1.0",
    "alembic>=1.19.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mutmut]
# Mutation testing for the core pure-logic modules (run: uv run mutmut run).
paths_to_mutate = [
    "src/shared/hybrid.py",
    "src/shared/caching.py",
    "src/shared/circuit_breaker.py",
    "src/evaluation/metrics.py",
]
tests_dir = ["tests"]

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["tests/*", ".venv/", "**/migrations/*"]
fix = true

[tool.ruff.lint]
select = ["E","F","Q","D","N"]
ignore = [
    "E203",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
]
preview = true

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true

[tool.isort]
profile = "black"
line_length = 79
lines_after_imports = 2
lines_between_types = 1
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
force_single_line = false

[tool.flake8]
max-line-length = 79
max-complexity = 10
ignore = [
    "W503",
    "F811",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
    "N806",
    "N818",
]
exclude = [
    "tests/",
    "venv/",
    "env/",
    ".venv/",
]


[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
strict = true
exclude = "tests/|test_.*\\.py"
