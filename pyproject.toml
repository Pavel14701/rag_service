[project]
name = "rag"
version = "0.1.0"
description = "Async RAG service: document indexing and retrieval-augmented QA over RabbitMQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.3.1",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.7.0",
    "dishka>=1.2.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=2.7.0",
    "unstructured[pdf,docx,md]>=0.15.0",
    "markdown>=3.5.2",
    "python-magic>=0.4.27",
    "minio>=7.2.7",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "langfuse>=2.44.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.1",
    "beautifulsoup4>=4.12.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "redis>=8.1.0",
    "alembic>=1.19.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mutmut]
# Mutation testing for the core pure-logic modules (run: uv run mutmut run).
paths_to_mutate = [
    "src/shared/hybrid.py",
    "src/shared/caching.py",
    "src/shared/circuit_breaker.py",
    "src/evaluation/metrics.py",
]
tests_dir = ["tests"]

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
